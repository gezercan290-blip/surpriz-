<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Heart 🤍</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .music-btn {
            position: absolute;
            z-index: 10;
            background: #ff3366;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.6);
            transition: 0.3s;
        }
        .music-btn:hover { transform: scale(1.05); background: #ff0033; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Tarayıcı müzik engeli için buton -->
    <button class="music-btn" id="startBtn" onclick="startSurprise()">Sürprizi Başlat kanka... ✨</button>

    <canvas id="heartCanvas"></canvas>

    <!-- 🎵 MASSIVE ATTACK - ANGEL ŞARKISI -->
    <audio id="bgMusic" loop src="https://audio.com"></audio>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        const words = [
            "I love you", "Seni seviyorum", "Te amo", "Je t'aime", 
            "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю", 
            "사랑해", "愛してる", "में तुमसे प्यार करता हूँ", 
            "Ik hou van jou", "Jag älskar dig", "Kocham cię", 
            "S'agapo", "Anh yêu em", "Aku cinta kamu"
        ];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const heartParticles = [];
        const totalPoints = 420; 

        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: x, y: y };
        }

        for (let i = 0; i < totalPoints; i++) {
            const t = (i / totalPoints) * 2 * Math.PI;
            const point = getHeartPoint(t);
            const colors = ['#ff3366', '#ff0033', '#ff6699', '#ff3300', '#ff0066', '#ff4d6d', '#ff758f'];
            
            heartParticles.push({
                baseX: point.x * 17,  
                baseY: -point.y * 17, 
                word: words[Math.floor(Math.random() * words.length)],
                color: colors[Math.floor(Math.random() * colors.length)],
                fontSize: 11 + Math.random() * 4,
                opacity: 0,
                delay: Math.random() * 2500 
            });
        }

        let animationStartTime = null;

        document.getElementById('bgMusic').volume = 0.5;

        function draw(timestamp) {
            if (!animationStartTime) animationStartTime = timestamp;
            const elapsed = timestamp - animationStartTime;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            heartParticles.forEach(p => {
                if (elapsed > p.delay) {
                    if (p.opacity < 1) p.opacity += 0.02; 
                    
                    ctx.save();
                    ctx.globalAlpha = p.opacity;
                    ctx.fillStyle = p.color;
                    ctx.font = `bold ${p.fontSize}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    ctx.fillText(p.word, centerX + p.baseX, centerY + p.baseY);
                    ctx.restore();
                }
            });

            requestAnimationFrame(draw);
        }

        function startSurprise() {
            document.getElementById('startBtn').classList.add('hidden');
            const music = document.getElementById('bgMusic');
            music.play().catch(e => console.log("Müzik engeli:", e));
            requestAnimationFrame(draw);
        }
    </script>
</body>
</html>
